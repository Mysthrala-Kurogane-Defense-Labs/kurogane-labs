services:
  nodered:
    profiles: [visualization]
    image: nodered/node-red:5.0.7@sha256:a649dd711d55490151a2c39a8e48ad0c44325488fbc0e66315f2d2e19e5e1ace
    ports:
      - "127.0.0.1:${LAB_HTTP_PORT:-1880}:1880"
    volumes:
      - node-red-data:/data
      - ./nodered:/data/public-examples:ro
    environment:
      NODE_RED_ENABLE_PROJECTS: "false"
  synthetic-plant:
    image: python:3.12-slim@sha256:dddfd7e07f9d15aeeca61529320492139d21cac7f0070c00609243e51e4e0016
    working_dir: /lab
    volumes:
      - ./:/lab:ro
    command: [python, synthetic-plant/generate_events.py, --once]
volumes:
  node-red-data:
